<!-- Ruòxī tray · state: offline · color: {colors.mute} #000000 -->
<!-- Cloud-off with a knocked-out gap around the slash (9-unit mask) so it stays crisp at 16px. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48">
  <mask id="tr-off-gap">
    <rect width="48" height="48" fill="#ffffff"/>
    <path d="M9 9 L39 39" stroke="#000000" stroke-width="9" stroke-linecap="round"/>
  </mask>
  <path d="M35 38H18a14 14 0 1 1 13.42-18h3.58a9 9 0 1 1 0 18Z" fill="none" stroke="#000000" stroke-width="4" stroke-linejoin="round" mask="url(#tr-off-gap)"/>
  <path d="M9 9 L39 39" fill="none" stroke="#000000" stroke-width="4" stroke-linecap="round"/>
</svg>
